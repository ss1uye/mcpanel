name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: portable (windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the repository npm version
        run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) { console.error('tag '+tag+' != v'+p.version); process.exit(1); }"
      - name: Build portable package
        shell: pwsh
        run: |
          $lines = & npm run release:portable 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $lines | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
      - name: Smoke portable package
        shell: pwsh
        run: |
          $lines = & npm run smoke:portable 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $lines | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mcpanel-portable-windows-x64
          path: |
            release/mcpanel-*-win-x64.zip
            release/SHA256SUMS.txt
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MC Panel ${{ github.ref_name }}
          # Every v* tag must ship a matching docs/releases/<tag>.md body.
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/mcpanel-*-win-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
